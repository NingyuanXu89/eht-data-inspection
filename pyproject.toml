[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eht-data-inspection"
version = "0.1.0"
description = "Inspection utilities for EHT/VLBI fringe, alist, and UVFITS data products."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Ningyuan Xu" }
]
dependencies = [
    "astropy",
    "eat",
    "ehtim",
    "matplotlib",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
alist = [
    "seaborn",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
